<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🎲 HoldMaster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:url('bg.jpg') center/cover no-repeat fixed;color:#fff;user-select:none;position:fixed;width:100%;inset:0;transition:background-image .5s}

.app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:rgba(0,0,0,0.35)}

.topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.4)}
.topbar .title{font-weight:700;color:#ffd700;font-size:.9em}
.topbar .room-code{font-size:.7em;opacity:.7;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:8px}

.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px;min-height:0;overflow-y:auto}

/* Boss 区域 */
.boss-area{display:flex;align-items:center;gap:12px;width:100%;max-width:400px;justify-content:center}
.boss-area .label{font-size:.8em;font-weight:700;padding:5px 14px;border-radius:12px;background:rgba(255,215,0,.15);color:#ffd700}
.boss-dice{display:flex;gap:6px}

.vs-divider{font-size:.9em;font-weight:800;color:rgba(255,255,255,.2);margin:2px 0}

/* 玩家区域 */
.player-area{display:flex;align-items:center;gap:12px;width:100%;max-width:400px;justify-content:center}
.player-area .label{font-size:.8em;font-weight:700;padding:5px 14px;border-radius:12px;background:rgba(81,207,102,.15);color:#51cf66}
.player-area .resources{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 12px;text-align:center}
.player-area .resources .res-item{display:flex;align-items:center;gap:4px;font-size:.8em;line-height:1.4}
.player-area .resources .res-val{font-weight:700;font-size:1em}
.res-water{color:#74c0fc}
.player-dice{display:flex;gap:6px}

/* 骰子 */
.dice-wrap{width:48px;height:48px;perspective:300px}
.dice{width:48px;height:48px;background:linear-gradient(145deg,#fff,#e8e8e8);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.8);transition:transform .3s}
.dice.rolling{animation:roll .5s ease-out}
.dice.waiting{opacity:.25}
@keyframes roll{0%{transform:rotateX(0) rotateY(0) scale(.8)}25%{transform:rotateX(180deg) rotateY(90deg) scale(1.1)}50%{transform:rotateX(360deg) rotateY(180deg) scale(.9)}75%{transform:rotateX(540deg) rotateY(270deg) scale(1.05)}100%{transform:rotateX(720deg) rotateY(360deg) scale(1)}}
.dot-cell{display:flex;align-items:center;justify-content:center}
.dot{width:8px;height:8px;background:radial-gradient(circle at 35% 35%,#4a4a4a,#1a1a1a);border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.dot.visible{opacity:1}

/* 中央区域 */
.center-area{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:400px}
.phase-label{font-size:.75em;padding:3px 12px;border-radius:10px;background:rgba(255,255,255,.1);text-align:center}

/* 大计时器 */
.big-timer{font-size:3.5em;font-weight:800;color:#51cf66;text-shadow:0 0 20px rgba(81,207,102,.5);line-height:1;margin:4px 0;letter-spacing:2px}
.big-timer.warn{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.5);animation:pulse 1s infinite}
.big-timer-label{font-size:.9em;opacity:.7;font-weight:600;color:#ffd700;margin-bottom:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* 下注区 */
.bet-area{display:none;flex-direction:column;align-items:center;gap:6px;width:100%}
.bet-area.visible{display:flex}
.bet-hint{font-size:.8em;color:rgba(255,255,255,.5);margin-bottom:2px}
.bet-type{display:flex;gap:10px}
.type-btn{padding:8px 18px;border:2px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:.85em;cursor:pointer;transition:all .15s;text-align:center}
.type-btn:active{transform:scale(.95)}
.type-btn.selected{border-color:#ffd700;background:rgba(255,215,0,.15)}
.type-btn .emoji{font-size:1em;margin-right:3px}
.bet-amount{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;cursor:pointer;border:2px dashed rgba(255,255,255,.35);transition:all .15s}
.chip:active{transform:scale(.9)}
.chip.selected{border-style:solid;transform:scale(1.05);box-shadow:0 0 10px rgba(255,255,255,.25)}
.chip.c1{background:#1abc9c}.chip.c3{background:#e67e22}.chip.c5{background:#c0392b}.chip.c10{background:#3498db}.chip.c15{background:#9b59b6}.chip.c30{background:#e74c3c}

/* 确认键 */
.confirm-bet-mobile{margin-top:4px;padding:10px 28px;font-size:.9em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:16px;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(255,215,0,.3)}
.confirm-bet-mobile:active:not(:disabled){transform:scale(.95)}
.confirm-bet-mobile:disabled{opacity:.35;cursor:not-allowed}
.bet-rules-hint{font-size:.7em;opacity:.45;text-align:center;line-height:1.5;margin-top:6px}

/* 结果 */
.result-area{display:none;text-align:center}
.result-area.visible{display:block}
.result-banner{font-size:.95em;font-weight:700;margin-bottom:2px}
.result-banner.win{color:#51cf66}.result-banner.lose{color:#ff6b6b}.result-banner.tie{color:#ffd43b}
.result-detail{font-size:.7em;opacity:.6}

/* 主按钮 */
.main-btn{display:none;padding:12px 36px;font-size:1em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:20px;cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(255,215,0,.3)}
.main-btn.visible{display:block}
.main-btn:active:not(:disabled){transform:scale(.95)}

/* 弹窗 */
.water-alert{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;justify-content:center;align-items:center}
.water-alert.open{display:flex}
.water-alert-content{background:rgba(20,15,40,.98);border:2px solid #74c0fc;border-radius:18px;padding:28px 24px;text-align:center;max-width:260px}
.water-alert .emoji{font-size:2.5em;margin-bottom:12px}
.water-alert .msg{font-size:1.05em;margin-bottom:16px;color:#74c0fc}
.water-alert .close-btn{padding:12px 28px;border:1px solid #74c0fc;border-radius:18px;background:none;color:#74c0fc;cursor:pointer;font-size:.9em}

.game-over{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;justify-content:center;align-items:center;flex-direction:column}
.game-over.open{display:flex}
.game-over .title{font-size:2.2em;margin-bottom:14px}
.game-over .msg{font-size:1.1em;margin-bottom:24px;text-align:center;line-height:1.5;max-width:260px}
.game-over .restart-btn{padding:14px 40px;font-size:1.05em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:22px;cursor:pointer}

/* 设置界面 */
.setup-screen{position:fixed;inset:0;display:none;justify-content:center;align-items:center;padding:20px;z-index:50;background:rgba(0,0,0,.5)}
.setup-screen.visible{display:flex}
.setup-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:28px 24px;width:100%;max-width:320px;text-align:center;max-height:90vh;overflow-y:auto}
.setup-box h3{margin-bottom:16px;color:#ffd700;font-size:1.2em}
.setup-row{margin-bottom:14px;text-align:left}
.setup-row label{display:block;font-size:.85em;opacity:.7;margin-bottom:5px}
.setup-row input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:1em;outline:none}
.setup-row input:focus{border-color:#ffd700}
.setup-lore{margin-bottom:14px;padding:14px;background:rgba(255,107,107,.08);border-left:3px solid #ff6b6b;border-radius:0 10px 10px 0;text-align:left;font-size:.85em;line-height:1.6;color:#ffa8a8}

/* 房间选择 */
.room-tabs{display:flex;gap:0;margin-bottom:14px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.room-tab{flex:1;padding:10px;text-align:center;font-size:.85em;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);transition:all .2s}
.room-tab.active{background:rgba(255,215,0,.2);color:#ffd700;font-weight:700}
.join-room-input{display:none;margin-bottom:14px}
.join-room-input.visible{display:block}
.join-room-input input{text-align:center;font-size:1.2em;letter-spacing:8px;font-weight:700}

.setup-btn{margin-top:8px;width:100%;padding:13px;font-size:1.05em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:20px;cursor:pointer}

/* 小屏幕优化 */
@media(max-height:600px){
  .big-timer{font-size:1.8em}
  .dice-wrap,.dice{width:42px;height:42px;padding:6px}
  .dot{width:7px;height:7px}
  .main{padding:4px;gap:4px}
}
</style>
</head>
<body>

<div class="water-alert" id="waterAlert">
  <div class="water-alert-content">
    <div class="emoji">💧</div>
    <div class="msg" id="waterAlertMsg">喝一杯水！</div>
    <button class="close-btn" onclick="closeWaterAlert()">知道了</button>
  </div>
</div>

<div class="water-alert" id="penaltyAlert">
  <div class="water-alert-content">
    <div class="emoji" id="penaltyEmoji">😈</div>
    <div class="msg" id="penaltyAlertMsg">惩罚</div>
    <button class="close-btn" onclick="closePenaltyAlert()">知道了</button>
  </div>
</div>

<div class="game-over" id="gameOver">
  <div class="title" id="gameOverTitle"></div>
  <div class="msg" id="gameOverMsg"></div>
  <button class="restart-btn" onclick="location.reload()">重新开始</button>
</div>

<div class="setup-screen visible" id="setupScreen">
  <div class="setup-box">
    <h3>🎲 HoldMaster</h3>
    <div class="setup-row">
      <label>昵称</label>
      <input type="text" id="playerNameInput" placeholder="输入昵称" maxlength="10" autocomplete="off">
    </div>
    <div class="setup-row">
      <label>QQ号</label>
      <input type="text" id="playerQQInput" placeholder="输入QQ号" maxlength="15" autocomplete="off" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="setup-lore">
      你进入了 HoldMaster 的领地<br>
      必须 乖乖Hold 30 分钟<br>
      <br>
      不过你可以押上自己的时间或水<br>
      游戏赢了，可以减少hold时间<br>
      倒计时归零，你就可以去释放了
    </div>
    <div class="setup-row">
      <label>邀请码</label>
      <input type="text" id="roomCodeInput" placeholder="输入邀请码" maxlength="6" autocomplete="off">
    </div>
    <button class="setup-btn" onclick="playerJoinGame()">快点开始吧 真的憋不住了</button>
  </div>
</div>

<div class="app" id="gameApp" style="display:none">
  <div class="topbar">
    <span class="title">🎲 HoldMaster</span>
    <span class="room-code" id="roomCodeDisplay">房间: ----</span>
  </div>

  <div class="main">
    <!-- Boss 区域 -->
    <div class="boss-area">
      <div class="label">👑 HoldMaster</div>
      <div class="boss-dice">
        <div class="dice-wrap"><div class="dice waiting" id="bossDice1"></div></div>
        <div class="dice-wrap"><div class="dice waiting" id="bossDice2"></div></div>
      </div>
    </div>
    <div class="vs-divider">VS</div>

    <!-- 中央区域 -->
    <div class="center-area">
      <div class="phase-label" id="phaseLabel">等待中</div>
      
      <div class="big-timer-label">释放倒计时</div>
      <div class="big-timer" id="bigTimer">30:00</div>

      <!-- 下注区 -->
      <div class="bet-area" id="betArea">
        <div class="bet-hint" id="betHint">请选择押时间或水</div>
        <div class="bet-type">
          <div class="type-btn" onclick="selectBetType('time')"><span class="emoji">⏱️</span>时间</div>
          <div class="type-btn" onclick="selectBetType('water')"><span class="emoji">💧</span>水</div>
        </div>
        <div class="bet-amount" id="betAmount"></div>
      </div>

      <!-- 结果 -->
      <div class="result-area" id="resultArea">
        <div class="result-banner" id="resultBanner"></div>
        <div class="result-detail" id="resultDetail"></div>
      </div>

      <!-- 主按钮 -->
      <button class="main-btn" id="mainBtn" onclick="onMainBtn()">🎲 开始</button>
    </div>

    <div class="vs-divider">VS</div>

    <!-- 玩家区域 -->
    <div class="player-area">
      <div class="label" id="playerLabel">👧 holding~girl</div>
      <div class="resources" id="playerResources">
        <div class="res-item">💧 <span class="res-val res-water" id="playerWaterDisplay">10</span> 杯水</div>
      </div>
      <div class="player-dice">
        <div class="dice-wrap"><div class="dice waiting" id="playerDice1"></div></div>
        <div class="dice-wrap"><div class="dice waiting" id="playerDice2"></div></div>
      </div>
    </div>
    <!-- 确认键 -->
    <button class="confirm-bet-mobile" id="confirmBetMobile" onclick="confirmBet()" style="display:none">确认下注</button>
    <div class="bet-rules-hint">
      下注时间，根据输赢增减相应时间<br>
      下注水，根据输赢增减时间<br>
      (1杯水等于6分钟)
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy…tVlI",
  authDomain: "holdmaster-11c61.firebaseapp.com",
  projectId: "holdmaster-11c61",
  storageBucket: "holdmaster-11c61.firebasestorage.app",
  messagingSenderId: "341270683153",
  appId: "1:341270683153:web:15666c97e4fd9918b15bb0",
  measurementId: "G-0W2381KYG1",
  databaseURL: "https://holdmaster-11c61-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ========== 变量 ==========
let roomId = null;
let playerId = null;
let playerName = '';
let playerQQ = '';
let secretMode = 2;
let playerTimeSec = 1800;
let playerWater = 10;
let timerInterval = null, timerRunning = false;
let localBetType = '', localSelectedChip = 0;
let hasJoined = false;

let G = {
  phase: 'idle', round: 0,
  playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
  betType: '', betAmount: 0,
  resultOutcome: '', resultText: '', resultDetail: ''
};

// ========== 房间路径 ==========
function rp(path) { return 'rooms/' + roomId + '/' + path; }

// ========== 加入房间 ==========
async function joinRoom(code) {
  const snap = await get(ref(db, 'rooms/' + code));
  if (!snap.exists()) {
    alert('房间不存在，请检查房间号');
    return false;
  }

  roomId = code;
  const data = snap.val();
  secretMode = data.mode != null ? data.mode : 2;
  playerId = 'p_' + Date.now();

  // 重置房间游戏状态
  await update(ref(db, 'rooms/' + roomId), {
    player: {
      id: playerId,
      name: playerName,
      qq: playerQQ,
      time: 1800,
      water: 10,
      status: 'active'
    },
    game: {
      phase: 'idle', round: 0,
      playerD1: 1, playerD2: 1, bossD1: 1, bossD2: 1,
      betType: '', betAmount: 0,
      resultOutcome: '', resultText: '', resultDetail: ''
    }
  });

  onDisconnect(ref(db, rp('player/status'))).set('disconnected');
  return true;
}

// ========== 飞书通知 ==========
const FEISHU_WEBHOOK = 'https://open.feishu.cn/open-apis/bot/v2/hook/c042c8cf-3dda-4c00-a774-78fb0895589f';

async function notifyFeishu(name, qq, roomCode) {
  try {
    await fetch(FEISHU_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        msg_type: 'interactive',
        card: {
          header: { title: { tag: 'plain_text', content: '🎮 新玩家加入' } },
          elements: [
            { tag: 'div', text: { tag: 'lark_md', content: '**昵称：** ' + name + '\n**QQ号：** ' + qq + '\n**房间号：** ' + roomCode } }
          ]
        }
      })
    });
  } catch (e) { console.error('飞书通知失败:', e); }
}

// ========== 进入游戏 ==========
function enterGame() {
  hasJoined = true;
  document.getElementById('setupScreen').classList.remove('visible');
  document.getElementById('gameApp').style.display = 'flex';
  document.getElementById('roomCodeDisplay').textContent = '房间: ' + roomId;
  document.getElementById('playerLabel').textContent = '👧 ' + playerName;
  notifyFeishu(playerName, playerQQ, roomId);
  initSync();
  renderUI();
}

// ========== 玩家加入 ==========
window.playerJoinGame = async function() {
  const name = document.getElementById('playerNameInput').value.trim();
  const qq = document.getElementById('playerQQInput').value.trim();
  if (!name) { alert('请输入昵称'); return; }
  if (!qq) { alert('请输入QQ号'); return; }

  playerName = name;
  playerQQ = qq;

  const code = document.getElementById('roomCodeInput').value.trim();
  if (!code) { alert('请输入邀请码'); return; }
  const ok = await joinRoom(code);
  if (ok) enterGame();
};

// ========== 工具函数 ==========
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function formatTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' + s : s); }

function controlledRoll(isPlayer) {
  if (secretMode === 0) {
    // 10%胜率
    if (Math.random() < 0.1) return isPlayer ? randInt(4, 6) : randInt(1, 3);
    return isPlayer ? randInt(1, 3) : randInt(4, 6);
  }
  if (secretMode === 1) return isPlayer ? randInt(1, 3) : randInt(4, 6);
  return randInt(1, 6);
}

// ========== 骰子渲染 ==========
const DP = { 1: [4], 2: [2, 6], 3: [2, 4, 6], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

function renderDice(el, val) {
  el.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'dot-cell';
    const dot = document.createElement('div');
    dot.className = 'dot' + (DP[val] && DP[val].includes(i) ? ' visible' : '');
    cell.appendChild(dot);
    el.appendChild(cell);
  }
}

// ========== 计时器 ==========
function updateBigTimer() {
  const el = document.getElementById('bigTimer');
  el.textContent = formatTime(Math.max(0, playerTimeSec));
  el.classList.toggle('warn', playerTimeSec <= 180);
  // 背景切换
  if (playerTimeSec > 4200) document.body.style.backgroundImage = "url('bg_verylong.jpg')";
  else if (playerTimeSec > 2700) document.body.style.backgroundImage = "url('bg_long.jpg')";
  else document.body.style.backgroundImage = "url('bg.jpg')";
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    if (playerTimeSec > 0) {
      playerTimeSec--;
      updateBigTimer();
      if (playerTimeSec % 5 === 0) {
        update(ref(db, rp('player')), { time: playerTimeSec });
      }
      if (playerTimeSec <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        checkGameOver();
      }
    }
  }, 1000);
}

function checkGameOver() {
  if (playerTimeSec <= 0) showGameOver(true);
  else if (playerWater <= 0) showGameOver(false);
}

function showGameOver(playerWin) {
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; }
  document.getElementById('gameOver').classList.add('open');
  document.getElementById('gameOverTitle').textContent = playerWin ? '🎉 释放！' : '😈 输了';
  document.getElementById('gameOverMsg').textContent = playerWin ? '你可以去释放了！' : '水喝完了，时间还没到...';
}

// ========== UI 渲染 ==========
function renderUI() {
  const phase = G.phase;
  document.getElementById('playerWaterDisplay').textContent = playerWater;
  updateBigTimer();

  const phaseNames = { idle: '等待中', waiting: '等待开始', roll1: '🎲 投骰子', betting: '💰 下注', roll2: '🎲 投骰子', result: '本局结束' };
  document.getElementById('phaseLabel').textContent = phaseNames[phase] || phase;

  const betArea = document.getElementById('betArea');
  const resultArea = document.getElementById('resultArea');
  const mainBtn = document.getElementById('mainBtn');
  betArea.classList.remove('visible');
  resultArea.classList.remove('visible');
  mainBtn.classList.remove('visible');

  if (phase === 'betting') {
    betArea.classList.add('visible');
    document.getElementById('betHint').style.display = localBetType ? 'none' : 'block';
    document.getElementById('betAmount').innerHTML = '';
    if (!localBetType) document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  }

  if (phase === 'result') {
    resultArea.classList.add('visible');
    document.getElementById('resultBanner').textContent = G.resultText || '';
    document.getElementById('resultBanner').className = 'result-banner ' + (G.resultOutcome || '');
    document.getElementById('resultDetail').textContent = G.resultDetail || '';
    mainBtn.classList.add('visible');
    mainBtn.textContent = '🎲 继续';
  }

  if (phase === 'idle' || phase === 'waiting') {
    mainBtn.classList.add('visible');
    mainBtn.textContent = '求你让我去释放';
  }

  renderDice(document.getElementById('playerDice1'), G.playerD1);
  renderDice(document.getElementById('playerDice2'), G.playerD2);
  renderDice(document.getElementById('bossDice1'), G.bossD1);
  renderDice(document.getElementById('bossDice2'), G.bossD2);
}

// ========== 下注 ==========
window.selectBetType = function(type) {
  localBetType = type;
  localSelectedChip = 0;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  renderBetChips();
};

window.renderBetChips = function() {
  const el = document.getElementById('betAmount');
  el.innerHTML = '';
  document.getElementById('betHint').style.display = 'none';
  const chips = localBetType === 'time' ? [1, 3, 5] : [1, 2, 3];
  chips.forEach(v => {
    const d = document.createElement('div');
    d.className = 'chip c' + v;
    d.textContent = localBetType === 'time' ? v + '分' : v + '杯';
    d.onclick = () => selectChip(v);
    el.appendChild(d);
  });
};

window.selectChip = function(val) {
  localSelectedChip = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  event.target.classList.add('selected');
  const btn = document.getElementById('confirmBetMobile');
  btn.disabled = false;
  btn.style.display = 'block';
};

window.confirmBet = function() {
  if (!localBetType || !localSelectedChip) return;
  update(ref(db, rp('game')), {
    betType: localBetType,
    betAmount: localSelectedChip,
    phase: 'roll2'
  });
  localBetType = '';
  localSelectedChip = 0;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('confirmBetMobile').style.display = 'none';
};

window.onMainBtn = function() {
  if (G.phase === 'result' || G.phase === 'idle') startNewRound();
};

function startNewRound() {
  const newRound = (G.round || 0) + 1;
  update(ref(db, rp('game')), {
    phase: 'roll1', round: newRound,
    playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
    betType: '', betAmount: 0,
    resultOutcome: '', resultText: '', resultDetail: ''
  });
}

// ========== 动画 ==========
function animateRoll1() {
  const pe = document.getElementById('playerDice1'), be = document.getElementById('bossDice1');
  pe.classList.add('rolling'); be.classList.add('rolling');
  let f = 0;
  const iv = setInterval(() => {
    renderDice(pe, randInt(1, 6));
    renderDice(be, randInt(1, 6));
    f++;
    if (f > 7) {
      clearInterval(iv);
      pe.classList.remove('rolling'); be.classList.remove('rolling');
      update(ref(db, rp('game')), {
        playerD1: controlledRoll(true),
        bossD1: controlledRoll(false),
        phase: 'betting'
      });
    }
  }, 80);
}

function animateRoll2() {
  const pe = document.getElementById('playerDice2'), be = document.getElementById('bossDice2');
  pe.classList.add('rolling'); be.classList.add('rolling');
  let f = 0;
  const iv = setInterval(() => {
    renderDice(pe, randInt(1, 6));
    renderDice(be, randInt(1, 6));
    f++;
    if (f > 7) {
      clearInterval(iv);
      pe.classList.remove('rolling'); be.classList.remove('rolling');
      update(ref(db, rp('game')), {
        playerD2: controlledRoll(true),
        bossD2: controlledRoll(false)
      });
      setTimeout(() => calculateAndWriteResult(), 500);
    }
  }, 80);
}

// ========== 计算结果 ==========
function calculateAndWriteResult() {
  const pt = G.playerD1 + G.playerD2, bt = G.bossD1 + G.bossD2;
  let outcome, resultText, detailText;

  if (pt > bt) {
    outcome = 'win';
    resultText = '🎉 你赢了！';
    if (G.betType === 'time') {
      const reduce = G.betAmount * 60;
      playerTimeSec = Math.max(0, playerTimeSec - reduce);
      detailText = '倒计时 -' + G.betAmount + '分钟';
    } else if (G.betType === 'water') {
      const reduce = G.betAmount * 6 * 60;
      playerTimeSec = Math.max(0, playerTimeSec - reduce);
      detailText = '倒计时 -' + (G.betAmount * 6) + '分钟';
    } else detailText = pt + ' vs ' + bt;
  } else if (pt < bt) {
    outcome = 'lose';
    resultText = '😢 你输了';
    if (G.betType === 'time') {
      playerTimeSec += G.betAmount * 60;
      detailText = '时间 +' + G.betAmount + '分钟';
    } else if (G.betType === 'water') {
      playerWater = Math.max(0, playerWater - G.betAmount);
      playerTimeSec += G.betAmount * 6 * 60;
      detailText = '喝了' + G.betAmount + '杯水，时间 +' + (G.betAmount * 6) + '分钟';
    } else detailText = pt + ' vs ' + bt;
  } else {
    outcome = 'tie';
    resultText = '⚖️ 平局';
    detailText = '点数相同';
  }

  update(ref(db, rp('game')), {
    resultOutcome: outcome,
    resultText: resultText,
    resultDetail: detailText,
    phase: 'result'
  });
  update(ref(db, rp('player')), {
    time: playerTimeSec,
    water: playerWater
  });
  updateBigTimer();

  // 卡片提示
  if (outcome === 'lose') {
    if (G.betType === 'time') setTimeout(() => showPenaltyAlert('多憋' + G.betAmount + '分钟'), 500);
    else if (G.betType === 'water') setTimeout(() => showPenaltyAlert('去喝' + G.betAmount + '杯水'), 500);
  } else if (outcome === 'win') {
    setTimeout(() => showPenaltyAlert('终于赢了，可以少憋会儿了！'), 500);
  }
  setTimeout(() => checkGameOver(), 1000);
}

// ========== Firebase 同步 ==========
function initSync() {
  // 监听房间模式
  onValue(ref(db, rp('mode')), snap => {
    const newMode = snap.val();
    secretMode = newMode != null ? newMode : 2;
  });

  // 监听游戏状态
  onValue(ref(db, rp('game')), snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    const oldPhase = G.phase;
    G = { ...G, ...data };

    if (G.phase === 'roll1' && oldPhase !== 'roll1') animateRoll1();
    else if (G.phase === 'roll2' && oldPhase !== 'roll2') animateRoll2();
    else if (G.phase === 'result' && oldPhase !== 'result') {
      if (!G.resultOutcome) calculateAndWriteResult();
    }

    if (G.phase !== 'idle' && G.phase !== 'waiting' && !timerRunning) startTimer();
    renderUI();
  });

  // 监听玩家数据
  onValue(ref(db, rp('player')), snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    if (data.time != null) playerTimeSec = data.time;
    if (data.water != null) playerWater = data.water;
    updateBigTimer();
    document.getElementById('playerWaterDisplay').textContent = playerWater;
  });
}

// ========== 弹窗 ==========
window.closeWaterAlert = () => document.getElementById('waterAlert').classList.remove('open');
window.showWaterAlert = msg => { document.getElementById('waterAlertMsg').textContent = msg; document.getElementById('waterAlert').classList.add('open'); };
window.closePenaltyAlert = () => document.getElementById('penaltyAlert').classList.remove('open');
window.showPenaltyAlert = msg => {
  document.getElementById('penaltyAlertMsg').textContent = msg;
  document.getElementById('penaltyAlert').classList.add('open');
  document.getElementById('penaltyEmoji').textContent = msg.includes('赢') ? '🎉' : '😈';
};

// ========== 初始化UI ==========
function initUI() {
  renderDice(document.getElementById('playerDice1'), 1);
  renderDice(document.getElementById('playerDice2'), 1);
  renderDice(document.getElementById('bossDice1'), 1);
  renderDice(document.getElementById('bossDice2'), 1);
  document.getElementById('playerDice1').classList.add('waiting');
  document.getElementById('playerDice2').classList.add('waiting');
  document.getElementById('bossDice1').classList.add('waiting');
  document.getElementById('bossDice2').classList.add('waiting');
}

initUI();
</script>
