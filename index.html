<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0c29">
<title>🎲 HoldMaster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;user-select:none;touch-action:manipulation;position:fixed;width:100%;inset:0}

/* 安全区域适配 */
.container{max-width:100%;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column;overflow:hidden}

/* 头部 */
.header{flex-shrink:0;text-align:center;padding:12px 16px 8px}
h1{font-size:1.3em;font-weight:700;text-shadow:0 0 15px rgba(255,200,0,0.4)}
.rate-info{font-size:.7em;opacity:.5;margin-top:4px}

/* 游戏区域 - 可滚动 */
.game-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 20px}

/* 玩家信息区 */
.players{display:flex;justify-content:space-between;align-items:stretch;gap:8px;margin-bottom:12px}
.player-area{flex:1;text-align:center;min-width:0}
.player-area .label{font-size:.85em;font-weight:600;padding:5px 12px;border-radius:16px;display:inline-block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.player-area .resources{padding:6px 8px;background:rgba(0,0,0,.35);border-radius:10px;margin-bottom:8px}
.player-area .resources .res-item{display:flex;align-items:center;justify-content:center;gap:4px;font-size:.85em;line-height:1.4}
.player-area .resources .res-val{font-weight:700;font-size:1.1em}
.res-gold{color:#ffd700}.res-time{color:#51cf66}.res-water{color:#74c0fc}
.timer-warn .res-time{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.player-area.boss .label{background:rgba(255,215,0,.2);color:#ffd700}
.player-area.player .label{background:rgba(81,207,102,.2);color:#51cf66}

/* VS 分隔 */
.vs-divider{display:flex;align-items:center;justify-content:center;padding:0 4px}
.vs-badge{font-size:1.2em;font-weight:800;color:rgba(255,255,255,.25)}

/* 骰子区域 */
.dice-section{background:radial-gradient(ellipse at center,#1a5c2e 0%,#0d3318 70%,#091a0d 100%);border-radius:20px;padding:16px 12px;border:3px solid #2a1a0a;box-shadow:inset 0 0 40px rgba(0,0,0,.5);margin-bottom:12px}
.dice-row{display:flex;justify-content:center;gap:16px;margin:8px 0}
.dice-slot{text-align:center}
.dice-slot .slot-label{font-size:.7em;opacity:.5;margin-bottom:4px}
.dice-wrap{width:64px;height:64px;perspective:400px}
.dice{width:64px;height:64px;background:linear-gradient(145deg,#fff,#e8e8e8);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:2px;box-shadow:0 4px 15px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.8);transition:transform .3s}
.dice.rolling{animation:roll .5s ease-out}
.dice.waiting{opacity:.3}
@keyframes roll{0%{transform:rotateX(0) rotateY(0) scale(.8)}25%{transform:rotateX(180deg) rotateY(90deg) scale(1.1)}50%{transform:rotateX(360deg) rotateY(180deg) scale(.9)}75%{transform:rotateX(540deg) rotateY(270deg) scale(1.05)}100%{transform:rotateX(720deg) rotateY(360deg) scale(1)}}
.dot-cell{display:flex;align-items:center;justify-content:center}
.dot{width:10px;height:10px;background:radial-gradient(circle at 35% 35%,#4a4a4a,#1a1a1a);border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.dot.visible{opacity:1}
.subtotal{margin-top:6px;font-size:.8em;opacity:.7;min-height:18px}

/* 阶段标签 */
.phase-bar{text-align:center;margin-bottom:12px}
.phase-label{display:inline-block;font-size:.85em;padding:6px 16px;border-radius:16px;background:rgba(255,255,255,.1);min-width:120px}

/* 下注区域 */
.bet-area{display:none;margin-bottom:16px}
.bet-area.visible{display:block}
.bet-title{font-size:1em;margin-bottom:10px;color:#ffd700;text-align:center;font-weight:600}
.bet-hint{font-size:.75em;opacity:.6;margin-bottom:12px;text-align:center;padding:0 8px}
.bet-type{display:flex;justify-content:center;gap:10px;margin-bottom:16px;padding:0 4px}
.type-btn{flex:1;max-width:140px;padding:12px 8px;border:2px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:.9em;cursor:pointer;transition:all .2s;text-align:center}
.type-btn:active{transform:scale(.96)}
.type-btn.selected{border-color:#ffd700;background:rgba(255,215,0,.2)}
.type-btn .emoji{font-size:1.3em;display:block;margin-bottom:2px}
.type-btn .desc{font-size:.7em;opacity:.6;margin-top:4px;line-height:1.3}

.bet-amount{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:0 8px}
.chip{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;cursor:pointer;border:3px dashed rgba(255,255,255,.4);transition:all .15s}
.chip:active{transform:scale(.9)}
.chip.selected{border-style:solid;transform:scale(1.05);box-shadow:0 0 15px rgba(255,255,255,.3)}
.chip.c10{background:#3498db}.chip.c20{background:#2ecc71}.chip.c30{background:#e74c3c}.chip.c60{background:#9b59b6}
.chip.c1{background:#1abc9c}.chip.c2{background:#e67e22}.chip.c3{background:#c0392b}

.confirm-bet{display:block;width:calc(100% - 32px);margin:0 auto;padding:14px;font-size:1em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:25px;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,215,0,.4)}
.confirm-bet:active:not(:disabled){transform:scale(.97)}
.confirm-bet:disabled{opacity:.4;cursor:not-allowed}

/* 结果 */
.result-banner{text-align:center;font-size:1.1em;font-weight:700;margin:12px 0 4px;min-height:30px;display:none}
.result-banner.visible{display:block}
.result-banner.win{color:#51cf66;text-shadow:0 0 15px rgba(81,207,102,.4)}
.result-banner.lose{color:#ff6b6b;text-shadow:0 0 15px rgba(255,107,107,.4)}
.result-banner.tie{color:#ffd43b}
.result-detail{text-align:center;font-size:.8em;opacity:.65;margin-bottom:12px;padding:0 12px;display:none;line-height:1.4}
.result-detail.visible{display:block}

/* 主按钮 */
.main-btn{display:block;width:calc(100% - 32px);max-width:280px;margin:12px auto;padding:14px;font-size:1.1em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:25px;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,215,0,.4)}
.main-btn:active:not(:disabled){transform:scale(.97)}
.main-btn:disabled{opacity:.4;cursor:not-allowed}

/* 历史记录 */
.history{margin-top:12px;background:rgba(0,0,0,.3);border-radius:14px;padding:12px;max-height:140px;overflow-y:auto;display:none}
.history.visible{display:block}
.history h3{font-size:.85em;opacity:.6;margin-bottom:8px}
.hist-item{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.75em}
.hist-item:last-child{border:none}
.hist-item .h-round{opacity:.4;width:32px}
.hist-item .h-detail{flex:1;text-align:center;padding:0 4px}
.hist-item .h-result{width:60px;text-align:right;font-weight:600}
.hist-item .h-result.win{color:#51cf66}.hist-item .h-result.lose{color:#ff6b6b}.hist-item .h-result.tie{color:#ffd43b}

/* 弹窗 - 喝水提醒 */
.water-alert{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:none;justify-content:center;align-items:center;padding:20px}
.water-alert.open{display:flex}
.water-alert-content{background:rgba(20,15,40,.98);border:2px solid #74c0fc;border-radius:18px;padding:28px 24px;text-align:center;max-width:280px;width:100%}
.water-alert .emoji{font-size:2.5em;margin-bottom:12px}
.water-alert .msg{font-size:1.1em;margin-bottom:20px;color:#74c0fc;line-height:1.4}
.water-alert .close-btn{padding:12px 32px;border:1px solid #74c0fc;border-radius:20px;background:none;color:#74c0fc;cursor:pointer;font-size:.95em}
.water-alert .close-btn:active{background:rgba(116,192,252,.1)}

/* 游戏结束 */
.game-over{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;justify-content:center;align-items:center;flex-direction:column;padding:20px}
.game-over.open{display:flex}
.game-over .title{font-size:2.2em;margin-bottom:16px}
.game-over .msg{font-size:1.1em;margin-bottom:28px;text-align:center;line-height:1.6;max-width:280px}
.game-over .restart-btn{padding:14px 44px;font-size:1.1em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:25px;cursor:pointer}
.game-over .restart-btn:active{transform:scale(.97)}

/* 设置界面 */
.name-setup,.waiting-setup{display:none;justify-content:center;align-items:center;min-height:60vh;padding:20px}
.name-setup.visible,.waiting-setup.visible{display:flex}
.setup-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:24px 20px;width:100%;max-width:320px;text-align:center}
.setup-box h3{margin-bottom:18px;color:#ffd700;font-size:1.2em}
.setup-row{margin-bottom:14px;text-align:left}
.setup-row label{display:block;font-size:.85em;opacity:.8;margin-bottom:6px}
.setup-row input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:1em;outline:none}
.setup-row input:focus{border-color:#ffd700}
.setup-info{margin-top:12px;padding:12px;background:rgba(255,215,0,.1);border-radius:10px;text-align:left;font-size:.8em;line-height:1.5}
.setup-btn{margin-top:14px;width:100%;padding:13px;font-size:1.05em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:22px;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,215,0,.4)}
.setup-btn:active{transform:scale(.97)}
.waiting-setup p{opacity:.6;margin-top:12px;font-size:.9em}

/* 小屏幕优化 */
@media(max-width:360px){
  h1{font-size:1.15em}
  .dice-wrap,.dice{width:56px;height:56px;padding:8px}
  .dot{width:9px;height:9px}
  .player-area .label{font-size:.75em;padding:4px 10px}
  .player-area .resources .res-item{font-size:.8em}
  .player-area .resources .res-val{font-size:1em}
  .chip{width:46px;height:46px;font-size:.8em}
  .type-btn{padding:10px 6px;font-size:.85em}
}

@media(min-width:361px) and (max-width:420px){
  .dice-wrap,.dice{width:60px;height:60px;padding:9px}
  .dot{width:10px;height:10px}
}

/* 横屏优化 */
@media(max-height:500px) and (orientation:landscape){
  .header{padding:8px 16px 4px}
  h1{font-size:1.1em}
  .dice-section{padding:10px 12px}
  .dice-wrap,.dice{width:52px;height:52px;padding:7px}
  .dot{width:8px;height:8px}
  .history{max-height:80px}
}
</style>
</head>
<body>
<div class="water-alert" id="waterAlert">
  <div class="water-alert-content">
    <div class="emoji">💧</div>
    <div class="msg" id="waterAlertMsg">喝一杯水！</div>
    <button class="close-btn" onclick="closeWaterAlert()">知道了</button>
  </div>
</div>

<div class="game-over" id="gameOver">
  <div class="title" id="gameOverTitle"></div>
  <div class="msg" id="gameOverMsg"></div>
  <button class="restart-btn" onclick="location.reload()">重新开始</button>
</div>

<div class="container">
  <div class="header">
    <h1>🎲 HoldMaster</h1>
    <div class="rate-info" id="rateInfo" style="display:none">1金币=2分钟 | 1杯水=6金币</div>
  </div>

  <!-- 玩家设置 -->
  <div class="game-scroll">
    <div class="name-setup" id="playerSetup">
      <div class="setup-box">
        <h3>🎮 报上名来</h3>
        <div class="setup-row">
          <label>你的名字</label>
          <input type="text" id="playerNameInput" placeholder="输入名字" maxlength="12" autocomplete="off">
        </div>
        <div class="setup-info">
          💰 汇率: 1金币 = 2分钟<br>
          💧 水量: 1杯水 = 6金币
        </div>
        <button class="setup-btn" onclick="playerJoinGame()">进入挑战</button>
      </div>
    </div>

    <!-- 等待界面 -->
    <div class="waiting-setup" id="waitingSetup">
      <div class="setup-box">
        <h3>⏳ 等待开始</h3>
        <p>游戏即将开始，请稍候</p>
      </div>
    </div>

    <!-- 游戏桌面 -->
    <div id="gameTable" style="display:none">
      <!-- 玩家信息 -->
      <div class="players">
        <div class="player-area boss">
          <div class="label">👑 Boss</div>
          <div class="resources">
            <div class="res-item">💰 <span class="res-val res-gold" id="bossGoldDisplay">60</span></div>
          </div>
        </div>
        <div class="vs-divider">
          <div class="vs-badge">VS</div>
        </div>
        <div class="player-area player" id="playerArea">
          <div class="label" id="playerLabel">🎮 挑战者</div>
          <div class="resources" id="playerResources">
            <div class="res-item">⏱️ <span class="res-val res-time" id="playerTimeDisplay">120:00</span></div>
            <div class="res-item">💧 <span class="res-val res-water" id="playerWaterDisplay">10</span></div>
          </div>
        </div>
      </div>

      <!-- 骰子区 -->
      <div class="dice-section">
        <div class="dice-row">
          <div class="dice-slot">
            <div class="slot-label">Boss 1</div>
            <div class="dice-wrap"><div class="dice waiting" id="bossDice1"></div></div>
          </div>
          <div class="dice-slot">
            <div class="slot-label">Boss 2</div>
            <div class="dice-wrap"><div class="dice waiting" id="bossDice2"></div></div>
          </div>
        </div>
        <div class="subtotal" id="bossSubtotal" style="text-align:center"></div>
        
        <div class="phase-bar">
          <div class="phase-label" id="phaseLabel">等待开始</div>
        </div>
        
        <div class="dice-row">
          <div class="dice-slot">
            <div class="slot-label">我 1</div>
            <div class="dice-wrap"><div class="dice waiting" id="playerDice1"></div></div>
          </div>
          <div class="dice-slot">
            <div class="slot-label">我 2</div>
            <div class="dice-wrap"><div class="dice waiting" id="playerDice2"></div></div>
          </div>
        </div>
        <div class="subtotal" id="playerSubtotal" style="text-align:center"></div>
      </div>

      <!-- 下注区 -->
      <div class="bet-area" id="betArea">
        <div class="bet-title">💰 下注</div>
        <div class="bet-hint" id="betHint">选择下注类型和金额</div>
        <div class="bet-type">
          <div class="type-btn" onclick="selectBetType('time')">
            <span class="emoji">⏱️</span>
            <div>押时间</div>
            <div class="desc">赢→Boss扣金币<br>输→你加时间</div>
          </div>
          <div class="type-btn" onclick="selectBetType('water')">
            <span class="emoji">💧</span>
            <div>押水</div>
            <div class="desc">赢→Boss扣金币<br>输→你喝水</div>
          </div>
        </div>
        <div class="bet-amount" id="betAmount"></div>
        <button class="confirm-bet" id="confirmBet" onclick="confirmBet()" disabled>确认下注</button>
      </div>

      <!-- 结果 -->
      <div class="result-banner" id="resultBanner"></div>
      <div class="result-detail" id="resultDetail"></div>

      <!-- 主按钮 -->
      <button class="main-btn" id="mainBtn" onclick="onMainBtn()" style="display:none">🎲 开始挑战</button>

      <!-- 历史 -->
      <div class="history" id="history">
        <h3>📜 历史记录</h3>
        <div id="histList"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1GwYRgXZ8DfTQ52PZ_KtWRtqa3DMtVlI",
  authDomain: "holdmaster-11c61.firebaseapp.com",
  projectId: "holdmaster-11c61",
  storageBucket: "holdmaster-11c61.firebasestorage.app",
  messagingSenderId: "341270683153",
  appId: "1:341270683153:web:15666c97e4fd9918b15bb0",
  measurementId: "G-0W2381KYG1""
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let playerId = null;
let playerName = '挑战者';
let secretMode = 3;

let G = {
  phase: 'idle', round: 0, playerName: '',
  playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
  betType: '', betAmount: 0,
  resultOutcome: '', resultText: '', resultDetail: ''
};

let bossGold = 60;
let playerTimeSec = 7200;
let playerWater = 10;
let timerInterval = null, timerRunning = false;
let localBetType = '', localSelectedChip = 0;
let historyAdded = new Set();

const DP={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const MN=['👑 必赢','💀 必输','🔥 5局赢','🎯 随机'];

window.formatTime=function(sec){const m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0'+s:s)};

window.renderDice=function(el,v){
  el.className='dice';el.innerHTML='';
  if(!v){el.classList.add('waiting');return}
  const p=DP[v]||[];
  for(let i=0;i<9;i++){
    const c=document.createElement('div');c.className='dot-cell';
    const d=document.createElement('div');d.className='dot'+(p.includes(i)?' visible':'');
    c.appendChild(d);el.appendChild(d);
  }
};

window.randInt=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};

window.closeWaterAlert=function(){document.getElementById('waterAlert').classList.remove('open')};
window.showWaterAlert=function(msg){document.getElementById('waterAlertMsg').textContent=msg;document.getElementById('waterAlert').classList.add('open')};

function controlledRoll(isPlayer, round){
  if(secretMode===0) return isPlayer?randInt(4,6):randInt(1,3);
  if(secretMode===1) return isPlayer?randInt(1,3):randInt(4,6);
  if(secretMode===2 && round<=5) return isPlayer?randInt(3,6):randInt(1,4);
  return randInt(1,6);
}

function renderGameUI(){
  const phase = G.phase;
  if(G.playerName) document.getElementById('playerLabel').textContent='🎮 '+G.playerName.slice(0,6);
  
  document.getElementById('bossGoldDisplay').textContent=bossGold;
  document.getElementById('playerTimeDisplay').textContent=formatTime(playerTimeSec);
  document.getElementById('playerWaterDisplay').textContent=playerWater;

  const pa=document.getElementById('playerArea');
  if(playerTimeSec<=180) pa.querySelector('.resources').classList.add('timer-warn');
  else pa.querySelector('.resources').classList.remove('timer-warn');

  if(phase==='idle') return;

  if(phase==='waiting'){
    showGameTable();
    document.getElementById('phaseLabel').textContent='等待开始...';
    document.getElementById('mainBtn').style.display='none';
    return;
  }

  showGameTable();

  if(phase==='roll1'){
    document.getElementById('phaseLabel').textContent='投第1个骰子';
    document.getElementById('mainBtn').style.display='none';
    document.getElementById('betArea').classList.remove('visible');
    document.getElementById('resultBanner').className='result-banner';
    document.getElementById('resultDetail').className='result-detail';
  }

  if(phase==='betting'){
    document.getElementById('phaseLabel').textContent='💰 下注阶段';
    document.getElementById('betArea').classList.add('visible');
    document.getElementById('betHint').textContent='当前: 我 '+G.playerD1+' vs Boss '+G.bossD1;
    document.getElementById('mainBtn').style.display='none';
    renderBetChips();
  }

  if(phase==='roll2'){
    document.getElementById('phaseLabel').textContent='投第2个骰子';
    document.getElementById('betArea').classList.remove('visible');
    document.getElementById('mainBtn').style.display='none';
  }

  if(phase==='result'){
    document.getElementById('phaseLabel').textContent='本局结束';
    document.getElementById('betArea').classList.remove('visible');
    const banner=document.getElementById('resultBanner');
    const detail=document.getElementById('resultDetail');
    banner.textContent=G.resultText;
    banner.className='result-banner visible '+G.resultOutcome;
    detail.textContent=G.resultDetail;
    detail.className='result-detail visible';
    document.getElementById('mainBtn').style.display='block';
    document.getElementById('mainBtn').textContent='🎲 继续';
  }

  renderDice(document.getElementById('playerDice1'), G.playerD1);
  renderDice(document.getElementById('playerDice2'), G.playerD2);
  renderDice(document.getElementById('bossDice1'), G.bossD1);
  renderDice(document.getElementById('bossDice2'), G.bossD2);

  if(G.playerD1) document.getElementById('playerSubtotal').textContent = G.playerD2 ? '总计: '+(G.playerD1+G.playerD2) : '当前: '+G.playerD1;
  else document.getElementById('playerSubtotal').textContent='';

  if(G.bossD1) document.getElementById('bossSubtotal').textContent = G.bossD2 ? '总计: '+(G.bossD1+G.bossD2) : '当前: '+G.bossD1;
  else document.getElementById('bossSubtotal').textContent='';
}

function showGameTable(){
  document.getElementById('playerSetup').classList.remove('visible');
  document.getElementById('waitingSetup').classList.remove('visible');
  document.getElementById('gameTable').style.display='block';
  document.getElementById('rateInfo').style.display='block';
}

function startTimer(){
  if(timerRunning) return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    if(playerTimeSec>0){
      playerTimeSec--;
      document.getElementById('playerTimeDisplay').textContent=formatTime(playerTimeSec);
      const pa=document.getElementById('playerArea');
      if(playerTimeSec<=180) pa.querySelector('.resources').classList.add('timer-warn');
      else pa.querySelector('.resources').classList.remove('timer-warn');
      if(playerTimeSec%5===0 && playerId){
        update(ref(db,'players/'+playerId),{time:playerTimeSec});
      }
      if(playerTimeSec<=0){
        clearInterval(timerInterval);
        timerRunning=false;
        checkGameOver();
      }
    }
  },1000);
}

function checkGameOver(){
  if(bossGold<=0) showGameOver(true);
  else if(playerTimeSec<=0 && playerWater<=0) showGameOver(false);
}

function showGameOver(playerWin){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false}
  const go=document.getElementById('gameOver');
  go.classList.add('open');
  if(playerWin){
    document.getElementById('gameOverTitle').textContent='🎉 你赢了！';
    document.getElementById('gameOverMsg').innerHTML='Boss 金币耗尽！<br>你击败了大Boss！';
  }else{
    document.getElementById('gameOverTitle').textContent='💀 你输了';
    document.getElementById('gameOverMsg').innerHTML='时间和水都耗尽了...<br>Boss 依然是王者';
  }
}

window.selectBetType=function(type){
  localBetType=type; localSelectedChip=0;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  renderBetChips();
  checkBetReady();
};

window.renderBetChips=function(){
  const el=document.getElementById('betAmount');el.innerHTML='';
  if(localBetType==='time'){
    [10,20,30,60].forEach(v=>{
      const d=document.createElement('div');d.className='chip c'+v;d.textContent=v;
      d.onclick=()=>selectChip(v);el.appendChild(d);
    });
  }else{
    [1,2,3].forEach(v=>{
      const d=document.createElement('div');d.className='chip c'+v;d.textContent=v+'杯';
      d.onclick=()=>selectChip(v);el.appendChild(d);
    });
  }
};

window.selectChip=function(val){
  localSelectedChip=val;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  event.target.classList.add('selected');
  checkBetReady();
};

window.checkBetReady=function(){
  document.getElementById('confirmBet').disabled=!(localBetType&&localSelectedChip);
};

window.confirmBet=function(){
  if(!localBetType||!localSelectedChip) return;
  set(ref(db,'game/betType'), localBetType);
  set(ref(db,'game/betAmount'), localSelectedChip);
  set(ref(db,'game/phase'), 'roll2');
  localBetType=''; localSelectedChip=0;
};

window.onMainBtn=function(){
  if(G.phase==='result' || G.phase==='idle') startNewRound();
};

function startNewRound(){
  const newRound = (G.round||0) + 1;
  set(ref(db,'game'), {
    phase: 'roll1', round: newRound, playerName: playerName,
    playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
    betType: '', betAmount: 0,
    resultOutcome: '', resultText: '', resultDetail: ''
  });
}

window.playerJoinGame=function(){
  const pi=document.getElementById('playerNameInput').value.trim();
  playerName=pi||'挑战者';
  playerId='player_'+Date.now();
  document.getElementById('playerLabel').textContent='🎮 '+playerName;
  document.getElementById('playerSetup').classList.remove('visible');
  document.getElementById('waitingSetup').classList.add('visible');

  set(ref(db,'players/'+playerId),{
    name:playerName, time:playerTimeSec, water:playerWater, status:'active'
  });
  onDisconnect(ref(db,'players/'+playerId)).remove();
};

function addHistory(outcome){
  const roundKey = G.round+'_'+G.playerName;
  if(historyAdded.has(roundKey)) return;
  historyAdded.add(roundKey);

  const hist=document.getElementById('history'),list=document.getElementById('histList');
  hist.classList.add('visible');
  const ti=G.betType==='time'?'⏱️':'💧';
  const txt={win:'胜',lose:'负',tie:'平'};
  const pt=G.playerD1+G.playerD2, bt=G.bossD1+G.bossD2;
  const item=document.createElement('div');
  item.className='hist-item';
  item.innerHTML='<span class="h-round">#'+G.round+'</span><span class="h-detail">'+pt+' vs '+bt+'</span><span class="h-result '+outcome+'">'+txt[outcome]+' '+ti+G.betAmount+'</span>';
  list.insertBefore(item,list.firstChild);
}

function initSync(){
  onValue(ref(db,'boss/mode'),(snap)=>{secretMode=snap.val()||3});

  onValue(ref(db,'boss/gold'),(snap)=>{
    bossGold=snap.val()||60;
    document.getElementById('bossGoldDisplay').textContent=bossGold;
  });

  onValue(ref(db,'game'),(snap)=>{
    if(!snap.exists()) return;
    const data=snap.val();
    const oldPhase=G.phase;
    G={...G,...data};

    if(G.phase==='roll1' && oldPhase!=='roll1') animateRoll1();
    else if(G.phase==='roll2' && oldPhase!=='roll2') animateRoll2();
    else if(G.phase==='result' && oldPhase!=='result'){
      if(!G.resultOutcome) calculateAndWriteResult();
      else{
        addHistory(G.resultOutcome);
        if(G.betType==='water' && G.resultOutcome==='lose'){
          setTimeout(()=>showWaterAlert('喝了'+G.betAmount+'杯水！'),500);
        }
        setTimeout(()=>checkGameOver(),1000);
      }
    }

    if(G.phase !== 'idle' && G.playerName && !timerRunning) startTimer();
    renderGameUI();
  });

  onValue(ref(db,'players'),(snap)=>{
    if(snap.exists()){
      const players=snap.val();
      const keys=Object.keys(players);
      if(keys.length>0){
        const p=players[keys[0]];
        playerTimeSec=p.time||7200;
        playerWater=p.water||10;
        if(!G.playerName) G.playerName=p.name||'挑战者';
        document.getElementById('playerTimeDisplay').textContent=formatTime(playerTimeSec);
        document.getElementById('playerWaterDisplay').textContent=playerWater;
        document.getElementById('playerLabel').textContent='🎮 '+G.playerName;
      }
    }
  });
}

function animateRoll1(){
  const pe=document.getElementById('playerDice1'),be=document.getElementById('bossDice1');
  pe.classList.add('rolling');be.classList.add('rolling');
  let f=0;
  const iv=setInterval(()=>{
    renderDice(pe,randInt(1,6));renderDice(be,randInt(1,6));
    f++;
    if(f>7){
      clearInterval(iv);
      pe.classList.remove('rolling');be.classList.remove('rolling');
      const pd1=controlledRoll(true,G.round);
      const bd1=controlledRoll(false,G.round);
      set(ref(db,'game/playerD1'),pd1);
      set(ref(db,'game/bossD1'),bd1);
      setTimeout(()=>set(ref(db,'game/phase'),'betting'),600);
    }
  },80);
}

function animateRoll2(){
  const pe=document.getElementById('playerDice2'),be=document.getElementById('bossDice2');
  pe.classList.add('rolling');be.classList.add('rolling');
  let f=0;
  const iv=setInterval(()=>{
    renderDice(pe,randInt(1,6));renderDice(be,randInt(1,6));
    f++;
    if(f>7){
      clearInterval(iv);
      pe.classList.remove('rolling');be.classList.remove('rolling');
      const pd2=controlledRoll(true,G.round);
      const bd2=controlledRoll(false,G.round);
      set(ref(db,'game/playerD2'),pd2);
      set(ref(db,'game/bossD2'),bd2);
      setTimeout(()=>calculateAndWriteResult(),500);
    }
  },80);
}

function calculateAndWriteResult(){
  const pt=G.playerD1+G.playerD2;
  const bt=G.bossD1+G.bossD2;
  let outcome,resultText,detailText;
  const pName=G.playerName||playerName;

  if(pt>bt){
    outcome='win';
    resultText='🎉 你赢了！';
    if(G.betType==='time'){
      const goldCost=Math.ceil(G.betAmount/2);
      bossGold=Math.max(0,bossGold-goldCost);
      detailText='Boss -'+goldCost+'金币';
    }else if(G.betType==='water'){
      const goldCost=G.betAmount*3;
      bossGold=Math.max(0,bossGold-goldCost);
      detailText='Boss -'+goldCost+'金币';
    }else{
      detailText=pt+' vs '+bt;
    }
  }else if(pt<bt){
    outcome='lose';
    resultText='😢 你输了';
    if(G.betType==='time'){
      playerTimeSec+=G.betAmount*60;
      detailText='时间 +'+G.betAmount+'分钟';
    }else if(G.betType==='water'){
      playerWater=Math.max(0,playerWater-G.betAmount);
      detailText='喝了'+G.betAmount+'杯水';
    }else{
      detailText=pt+' vs '+bt;
    }
  }else{
    outcome='tie';
    resultText='⚖️ 平局';
    detailText='点数相同';
  }

  const updates={};
  updates['game/resultOutcome']=outcome;
  updates['game/resultText']=resultText;
  updates['game/resultDetail']=detailText;
  updates['game/phase']='result';
  updates['boss/gold']=bossGold;

  if(playerId){
    updates['players/'+playerId+'/time']=playerTimeSec;
    updates['players/'+playerId+'/water']=playerWater;
  }

  update(ref(db),updates);
  addHistory(outcome);

  if(G.betType==='water' && outcome==='lose'){
    setTimeout(()=>showWaterAlert('喝了'+G.betAmount+'杯水！'),500);
  }
  setTimeout(()=>checkGameOver(),1000);
}

function initUI(){
  renderDice(document.getElementById('playerDice1'),1);
  renderDice(document.getElementById('playerDice2'),1);
  renderDice(document.getElementById('bossDice1'),1);
  renderDice(document.getElementById('bossDice2'),1);
  document.getElementById('playerDice1').classList.add('waiting');
  document.getElementById('playerDice2').classList.add('waiting');
  document.getElementById('bossDice1').classList.add('waiting');
  document.getElementById('bossDice2').classList.add('waiting');

  document.getElementById('playerSetup').classList.add('visible');
  initSync();
}

// 防止双击缩放
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

initUI();
</script>
