<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title> HoldMaster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;user-select:none;position:fixed;width:100%;inset:0}

.app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.3)}
.topbar .title{font-weight:700;color:#ffd700;font-size:1em}
.topbar .info{opacity:.6;font-size:.75em}

.main{flex:1;display:flex;align-items:stretch;padding:8px 10px;gap:8px;min-height:0;overflow:hidden}

.col-left,.col-right{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:90px;max-width:130px}
.col-left .label{font-size:.8em;font-weight:700;padding:5px 14px;border-radius:12px;background:rgba(255,215,0,.15);color:#ffd700;margin-bottom:6px}
.col-right .label{font-size:.8em;font-weight:700;padding:5px 14px;border-radius:12px;background:rgba(81,207,102,.15);color:#51cf66;margin-bottom:6px}
.resources{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 10px;text-align:center;margin-bottom:6px;width:100%}
.resources .res-item{display:flex;align-items:center;justify-content:center;gap:4px;font-size:.8em;line-height:1.5}
.resources .res-val{font-weight:700;font-size:1.05em}
.res-gold{color:#ffd700}.res-time{color:#51cf66}.res-water{color:#74c0fc}
.timer-warn .res-time{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.col-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}

.vs-badge{font-size:1em;font-weight:800;color:rgba(255,255,255,.15)}
.phase-label{font-size:.75em;padding:3px 12px;border-radius:10px;background:rgba(255,255,255,.1);text-align:center;min-width:80px}

.dice-pair{display:flex;gap:8px}
.dice-wrap{width:50px;height:50px;perspective:300px}
.dice{width:50px;height:50px;background:linear-gradient(145deg,#fff,#e8e8e8);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.8);transition:transform .3s}
.dice.rolling{animation:roll .5s ease-out}
.dice.waiting{opacity:.25}
@keyframes roll{0%{transform:rotateX(0) rotateY(0) scale(.8)}25%{transform:rotateX(180deg) rotateY(90deg) scale(1.1)}50%{transform:rotateX(360deg) rotateY(180deg) scale(.9)}75%{transform:rotateX(540deg) rotateY(270deg) scale(1.05)}100%{transform:rotateX(720deg) rotateY(360deg) scale(1)}}
.dot-cell{display:flex;align-items:center;justify-content:center}
.dot{width:8px;height:8px;background:radial-gradient(circle at 35% 35%,#4a4a4a,#1a1a1a);border-radius:50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.dot.visible{opacity:1}
.subtotal{font-size:.7em;opacity:.6;margin-top:3px;text-align:center;min-height:12px}

/* 中央大计时器 */
.big-timer{font-size:2em;font-weight:800;color:#51cf66;text-shadow:0 0 15px rgba(81,207,102,.4);line-height:1;margin:1px 0;letter-spacing:1px}
.big-timer.warn{color:#ff6b6b;text-shadow:0 0 20px rgba(255,107,107,.4);animation:pulse 1s infinite}
.big-timer-label{font-size:.65em;opacity:.5;margin-bottom:0}

.bet-area{display:none;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:300px}
.bet-area.visible{display:flex}
.bet-title{font-size:.8em;color:#ffd700;font-weight:600}
.bet-type{display:flex;gap:8px}
.type-btn{padding:6px 14px;border:2px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(255,255,255,.05);color:#fff;font-size:.8em;cursor:pointer;transition:all .15s;text-align:center}
.type-btn:active{transform:scale(.95)}
.type-btn.selected{border-color:#ffd700;background:rgba(255,215,0,.15)}
.type-btn .emoji{font-size:1.1em;margin-right:3px}
.bet-amount{display:flex;gap:8px}
.chip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75em;cursor:pointer;border:2px dashed rgba(255,255,255,.35);transition:all .15s}
.chip:active{transform:scale(.9)}
.chip.selected{border-style:solid;transform:scale(1.05);box-shadow:0 0 10px rgba(255,255,255,.25)}
.chip.c10{background:#3498db}.chip.c20{background:#2ecc71}.chip.c30{background:#e74c3c}.chip.c60{background:#9b59b6}
.chip.c1{background:#1abc9c}.chip.c2{background:#e67e22}.chip.c3{background:#c0392b}
.confirm-bet{padding:6px 24px;font-size:.8em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:14px;cursor:pointer;transition:all .15s}
.confirm-bet:active:not(:disabled){transform:scale(.95)}
.confirm-bet:disabled{opacity:.35;cursor:not-allowed}
.confirm-bet-mobile{margin-top:8px;padding:8px 16px;font-size:.8em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:14px;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(255,215,0,.3)}
.confirm-bet-mobile:active:not(:disabled){transform:scale(.95)}
.confirm-bet-mobile:disabled{opacity:.35;cursor:not-allowed}

.result-area{display:none;text-align:center}
.result-area.visible{display:block}
.result-banner{font-size:.95em;font-weight:700;margin-bottom:2px}
.result-banner.win{color:#51cf66}.result-banner.lose{color:#ff6b6b}.result-banner.tie{color:#ffd43b}
.result-detail{font-size:.7em;opacity:.6}

.main-btn{display:none;padding:10px 32px;font-size:.95em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:20px;cursor:pointer;transition:all .15s;box-shadow:0 3px 10px rgba(255,215,0,.3)}
.main-btn.visible{display:block}
.main-btn:active:not(:disabled){transform:scale(.95)}

.bottombar{flex-shrink:0;display:flex;justify-content:center;align-items:center;padding:4px 16px;background:rgba(0,0,0,.2);font-size:.7em;opacity:.5;gap:12px}

.water-alert{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;justify-content:center;align-items:center}
.water-alert.open{display:flex}
.water-alert-content{background:rgba(20,15,40,.98);border:2px solid #74c0fc;border-radius:18px;padding:28px 24px;text-align:center;max-width:260px}
.water-alert .emoji{font-size:2.5em;margin-bottom:12px}
.water-alert .msg{font-size:1.05em;margin-bottom:16px;color:#74c0fc}
.water-alert .close-btn{padding:12px 28px;border:1px solid #74c0fc;border-radius:18px;background:none;color:#74c0fc;cursor:pointer;font-size:.9em}

.game-over{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:none;justify-content:center;align-items:center;flex-direction:column}
.game-over.open{display:flex}
.game-over .title{font-size:2.2em;margin-bottom:14px}
.game-over .msg{font-size:1.1em;margin-bottom:24px;text-align:center;line-height:1.5;max-width:260px}
.game-over .restart-btn{padding:14px 40px;font-size:1.05em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:22px;cursor:pointer}

.setup-screen{position:fixed;inset:0;display:none;justify-content:center;align-items:center;padding:20px;z-index:50;background:rgba(0,0,0,.5)}
.setup-screen.visible{display:flex}
.setup-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:28px 24px;width:100%;max-width:300px;text-align:center}
.setup-box h3{margin-bottom:16px;color:#ffd700;font-size:1.2em}
.setup-row{margin-bottom:14px;text-align:left}
.setup-row label{display:block;font-size:.85em;opacity:.7;margin-bottom:5px}
.setup-row input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:rgba(0,0,0,.3);color:#fff;font-size:1em;outline:none}
.setup-row input:focus{border-color:#ffd700}
.setup-info{margin-top:12px;padding:12px;background:rgba(255,215,0,.08);border-radius:10px;text-align:left;font-size:.8em;line-height:1.5}
.setup-btn{margin-top:14px;width:100%;padding:13px;font-size:1.05em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:20px;cursor:pointer}

.rotate-hint{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px}
.rotate-hint.visible{display:flex}
.rotate-hint .icon{font-size:3em;margin-bottom:16px;animation:rotate90 2s infinite}
.rotate-hint .text{font-size:1.1em;opacity:.7}
@keyframes rotate90{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}

@media(max-height:360px){
  .dice-wrap,.dice{width:42px;height:42px;padding:6px}
  .dot{width:7px;height:7px}
  .col-left,.col-right{min-width:80px;max-width:100px}
  .big-timer{font-size:1.6em}
  .topbar{padding:5px 10px;font-size:.8em}
  .bottombar{padding:3px 10px;font-size:.65em}
  .main{padding:4px 6px;gap:4px}
  .chip{width:32px;height:32px;font-size:.7em}
  .type-btn{padding:5px 10px;font-size:.75em}
}
</style>
</head>
<body>

<div class="rotate-hint" id="rotateHint">
  <div class="icon">📱</div>
  <div class="text">请横屏使用</div>
</div>

<div class="water-alert" id="waterAlert">
  <div class="water-alert-content">
    <div class="emoji">💧</div>
    <div class="msg" id="waterAlertMsg">喝一杯水！</div>
    <button class="close-btn" onclick="closeWaterAlert()">知道了</button>
  </div>
</div>

<div class="game-over" id="gameOver">
  <div class="title" id="gameOverTitle"></div>
  <div class="msg" id="gameOverMsg"></div>
  <button class="restart-btn" onclick="location.reload()">重新开始</button>
</div>

<div class="setup-screen visible" id="setupScreen">
  <div class="setup-box">
    <h3> HoldMaster</h3>
    <div class="setup-row">
      <label>你的名字</label>
      <input type="text" id="playerNameInput" placeholder="输入名字" maxlength="10" autocomplete="off">
    </div>
    <div class="setup-info">
      💰 1金币 = 2分钟<br>
       1杯水 = 6金币
    </div>
    <button class="setup-btn" onclick="playerJoinGame()">进入挑战</button>
  </div>
</div>

<div class="app" id="gameApp" style="display:none">
  <div class="topbar">
    <span class="title">🎲 HoldMaster</span>
    <span class="info">1金=2分 | 1水=6金</span>
  </div>

  <div class="main">
    <!-- 左：Boss + 确认键 -->
    <div class="col-left">
      <div class="label">👑 Boss</div>
      <div class="resources">
        <div class="res-item">💰 <span class="res-val res-gold" id="bossGoldDisplay">60</span></div>
      </div>
      <div class="dice-pair">
        <div class="dice-wrap"><div class="dice waiting" id="bossDice1"></div></div>
        <div class="dice-wrap"><div class="dice waiting" id="bossDice2"></div></div>
      </div>
      <div class="subtotal" id="bossSubtotal"></div>
      <button class="confirm-bet-mobile" id="confirmBetMobile" onclick="confirmBet()" style="display:none">确认下注</button>
    </div>

    <!-- 中：计时器+下注+结果 -->
    <div class="col-center">
      <div class="phase-label" id="phaseLabel">等待中</div>
      
      <!-- 大计时器 -->
      <div class="big-timer-label">剩余时间</div>
      <div class="big-timer" id="bigTimer">120:00</div>

      <!-- 下注区 -->
      <div class="bet-area" id="betArea">
        <div class="bet-title">💰 下注</div>
        <div class="bet-type">
          <div class="type-btn" onclick="selectBetType('time')"><span class="emoji">⏱️</span>时间</div>
          <div class="type-btn" onclick="selectBetType('water')"><span class="emoji">💧</span>水</div>
        </div>
        <div class="bet-amount" id="betAmount"></div>
      </div>

      <!-- 结果 -->
      <div class="result-area" id="resultArea">
        <div class="result-banner" id="resultBanner"></div>
        <div class="result-detail" id="resultDetail"></div>
      </div>

      <!-- 主按钮 -->
      <button class="main-btn" id="mainBtn" onclick="onMainBtn()">🎲 开始</button>
    </div>

    <!-- 右：玩家 -->
    <div class="col-right">
      <div class="label" id="playerLabel"> 挑战者</div>
      <div class="resources" id="playerResources">
        <div class="res-item">💧 <span class="res-val res-water" id="playerWaterDisplay">10</span> 杯</div>
      </div>
      <div class="dice-pair">
        <div class="dice-wrap"><div class="dice waiting" id="playerDice1"></div></div>
        <div class="dice-wrap"><div class="dice waiting" id="playerDice2"></div></div>
      </div>
      <div class="subtotal" id="playerSubtotal"></div>
    </div>
  </div>

  <div class="bottombar">
    <span id="roundInfo">回合 -</span>
    <span>|</span>
    <span id="modeInfo">模式: 随机</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSy…tVlI",
  authDomain: "holdmaster-11c61.firebaseapp.com",
  projectId: "holdmaster-11c61",
  storageBucket: "holdmaster-11c61.firebasestorage.app",
  messagingSenderId: "341270683153",
  appId: "1:341270683153:web:15666c97e4fd9918b15bb0",
  measurementId: "G-0W2381KYG1",
  databaseURL: "https://holdmaster-11c61-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let playerId = null;
let playerName = '挑战者';
let secretMode = 3;

let G = {
  phase: 'idle', round: 0, playerName: '',
  playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
  betType: '', betAmount: 0,
  resultOutcome: '', resultText: '', resultDetail: ''
};

let bossGold = 60;
let playerTimeSec = 7200;
let playerWater = 10;
let timerInterval = null, timerRunning = false;
let localBetType = '', localSelectedChip = 0;
let hasJoined = false;

const DP={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const MN=['👑必赢','💀必输','🔥5局赢','🎯随机'];

window.formatTime = s => { const m=Math.floor(s/60),sec=s%60; return m+':'+(sec<10?'0'+sec:sec); };

window.renderDice = function(el, v) {
  el.className = 'dice';
  el.innerHTML = '';
  if (!v) { el.classList.add('waiting'); return; }
  const p = DP[v] || [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'dot-cell';
    const d = document.createElement('div');
    d.className = 'dot' + (p.includes(i) ? ' visible' : '');
    c.appendChild(d);
    el.appendChild(c);
  }
};

window.randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
window.closeWaterAlert = () => document.getElementById('waterAlert').classList.remove('open');
window.showWaterAlert = msg => { document.getElementById('waterAlertMsg').textContent = msg; document.getElementById('waterAlert').classList.add('open'); };

function controlledRoll(isPlayer, round) {
  if (secretMode === 0) return isPlayer ? randInt(4, 6) : randInt(1, 3);
  if (secretMode === 1) return isPlayer ? randInt(1, 3) : randInt(4, 6);
  if (secretMode === 2 && round <= 5) return isPlayer ? randInt(3, 6) : randInt(1, 4);
  return randInt(1, 6);
}

function checkOrientation() {
  const isLandscape = window.innerWidth > window.innerHeight;
  document.getElementById('rotateHint').classList.toggle('visible', !isLandscape);
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));

function showGameUI() {
  document.getElementById('setupScreen').classList.remove('visible');
  document.getElementById('gameApp').style.display = 'flex';
  checkOrientation();
}

function updateBigTimer() {
  const el = document.getElementById('bigTimer');
  el.textContent = formatTime(playerTimeSec);
  el.classList.toggle('warn', playerTimeSec <= 180);
}

function renderUI() {
  const phase = G.phase;
  
  document.getElementById('bossGoldDisplay').textContent = bossGold;
  document.getElementById('playerWaterDisplay').textContent = playerWater;
  updateBigTimer();
  document.getElementById('roundInfo').textContent = '回合 ' + (G.round || '-');
  document.getElementById('modeInfo').textContent = '模式: ' + MN[secretMode];

  const phaseNames = { idle: '等待中', waiting: '等待开始', roll1: '🎲 投骰子', betting: '💰 下注', roll2: '🎲 投骰子', result: '本局结束' };
  document.getElementById('phaseLabel').textContent = phaseNames[phase] || phase;

  const betArea = document.getElementById('betArea');
  const resultArea = document.getElementById('resultArea');
  const mainBtn = document.getElementById('mainBtn');

  betArea.classList.remove('visible');
  document.getElementById('confirmBetMobile').style.display = 'none';
  resultArea.classList.remove('visible');
  mainBtn.classList.remove('visible');

  if (phase === 'betting') {
    betArea.classList.add('visible');
    renderBetChips();
  }

  if (phase === 'result') {
    resultArea.classList.add('visible');
    document.getElementById('resultBanner').textContent = G.resultText || '';
    document.getElementById('resultBanner').className = 'result-banner ' + (G.resultOutcome || '');
    document.getElementById('resultDetail').textContent = G.resultDetail || '';
    mainBtn.classList.add('visible');
    mainBtn.textContent = ' 继续';
  }

  if (phase === 'idle' || phase === 'waiting') {
    mainBtn.classList.add('visible');
    mainBtn.textContent = '🎲 开始挑战';
  }

  renderDice(document.getElementById('playerDice1'), G.playerD1);
  renderDice(document.getElementById('playerDice2'), G.playerD2);
  renderDice(document.getElementById('bossDice1'), G.bossD1);
  renderDice(document.getElementById('bossDice2'), G.bossD2);

  document.getElementById('playerSubtotal').textContent = G.playerD1 ? (G.playerD2 ? '=' + (G.playerD1 + G.playerD2) : G.playerD1) : '';
  document.getElementById('bossSubtotal').textContent = G.bossD1 ? (G.bossD2 ? '=' + (G.bossD1 + G.bossD2) : G.bossD1) : '';
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    if (playerTimeSec > 0) {
      playerTimeSec--;
      updateBigTimer();
      if (playerTimeSec % 5 === 0 && playerId) {
        update(ref(db, 'players/' + playerId), { time: playerTimeSec });
      }
      if (playerTimeSec <= 0) { clearInterval(timerInterval); timerRunning = false; checkGameOver(); }
    }
  }, 1000);
}

function checkGameOver() {
  if (bossGold <= 0) showGameOver(true);
  else if (playerTimeSec <= 0 && playerWater <= 0) showGameOver(false);
}

function showGameOver(playerWin) {
  if (timerRunning) { clearInterval(timerInterval); timerRunning = false; }
  document.getElementById('gameOver').classList.add('open');
  document.getElementById('gameOverTitle').textContent = playerWin ? '🎉 赢了！' : '💀 输了';
  document.getElementById('gameOverMsg').textContent = playerWin ? 'Boss金币耗尽！你赢了！' : '时间和水都耗尽了...';
}

window.selectBetType = function(type) {
  localBetType = type;
  localSelectedChip = 0;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  renderBetChips();
  checkBetReady();
};

window.renderBetChips = function() {
  const el = document.getElementById('betAmount');
  el.innerHTML = '';
  const chips = localBetType === 'time' ? [10, 20, 30, 60] : [1, 2, 3];
  chips.forEach(v => {
    const d = document.createElement('div');
    d.className = 'chip c' + v;
    d.textContent = localBetType === 'water' ? v + '杯' : v;
    d.onclick = () => selectChip(v);
    el.appendChild(d);
  });
};

window.selectChip = function(val) {
  localSelectedChip = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  event.target.classList.add('selected');
  checkBetReady();
};

window.checkBetReady = function() {
  const btn = document.getElementById('confirmBetMobile');
  btn.disabled = !(localBetType && localSelectedChip);
  btn.style.display = 'block';
};

window.confirmBet = function() {
  if (!localBetType || !localSelectedChip) return;
  set(ref(db, 'game/betType'), localBetType);
  set(ref(db, 'game/betAmount'), localSelectedChip);
  set(ref(db, 'game/phase'), 'roll2');
  localBetType = '';
  localSelectedChip = 0;
};

window.onMainBtn = function() {
  if (G.phase === 'result' || G.phase === 'idle') {
    startNewRound();
  }
};

function startNewRound() {
  const newRound = (G.round || 0) + 1;
  set(ref(db, 'game'), {
    phase: 'roll1', round: newRound, playerName: playerName,
    playerD1: 0, playerD2: 0, bossD1: 0, bossD2: 0,
    betType: '', betAmount: 0,
    resultOutcome: '', resultText: '', resultDetail: ''
  });
}

window.playerJoinGame = function() {
  const pi = document.getElementById('playerNameInput').value.trim();
  playerName = pi || '挑战者';
  playerId = 'player_' + Date.now();
  hasJoined = true;
  
  document.getElementById('playerLabel').textContent = '🎮 ' + playerName;
  
  set(ref(db, 'players/' + playerId), {
    name: playerName, time: playerTimeSec, water: playerWater, status: 'active'
  });
  onDisconnect(ref(db, 'players/' + playerId)).remove();
  
  showGameUI();
  renderUI();
};

function animateRoll1() {
  const pe = document.getElementById('playerDice1'), be = document.getElementById('bossDice1');
  pe.classList.add('rolling');
  be.classList.add('rolling');
  let f = 0;
  const iv = setInterval(() => {
    renderDice(pe, randInt(1, 6));
    renderDice(be, randInt(1, 6));
    f++;
    if (f > 7) {
      clearInterval(iv);
      pe.classList.remove('rolling');
      be.classList.remove('rolling');
      set(ref(db, 'game/playerD1'), controlledRoll(true, G.round));
      set(ref(db, 'game/bossD1'), controlledRoll(false, G.round));
      setTimeout(() => set(ref(db, 'game/phase'), 'betting'), 600);
    }
  }, 80);
}

function animateRoll2() {
  const pe = document.getElementById('playerDice2'), be = document.getElementById('bossDice2');
  pe.classList.add('rolling');
  be.classList.add('rolling');
  let f = 0;
  const iv = setInterval(() => {
    renderDice(pe, randInt(1, 6));
    renderDice(be, randInt(1, 6));
    f++;
    if (f > 7) {
      clearInterval(iv);
      pe.classList.remove('rolling');
      be.classList.remove('rolling');
      set(ref(db, 'game/playerD2'), controlledRoll(true, G.round));
      set(ref(db, 'game/bossD2'), controlledRoll(false, G.round));
      setTimeout(() => calculateAndWriteResult(), 500);
    }
  }, 80);
}

function calculateAndWriteResult() {
  const pt = G.playerD1 + G.playerD2, bt = G.bossD1 + G.bossD2;
  let outcome, resultText, detailText;

  if (pt > bt) {
    outcome = 'win';
    resultText = '🎉 你赢了！';
    if (G.betType === 'time') { const c = Math.ceil(G.betAmount / 2); bossGold = Math.max(0, bossGold - c); detailText = 'Boss -' + c + '金币'; }
    else if (G.betType === 'water') { const c = G.betAmount * 3; bossGold = Math.max(0, bossGold - c); detailText = 'Boss -' + c + '金币'; }
    else detailText = pt + ' vs ' + bt;
  } else if (pt < bt) {
    outcome = 'lose';
    resultText = '😢 你输了';
    if (G.betType === 'time') { playerTimeSec += G.betAmount * 60; detailText = '时间 +' + G.betAmount + '分钟'; }
    else if (G.betType === 'water') { playerWater = Math.max(0, playerWater - G.betAmount); detailText = '喝了' + G.betAmount + '杯水'; }
    else detailText = pt + ' vs ' + bt;
  } else {
    outcome = 'tie';
    resultText = '⚖️ 平局';
    detailText = '点数相同';
  }

  const updates = {};
  updates['game/resultOutcome'] = outcome;
  updates['game/resultText'] = resultText;
  updates['game/resultDetail'] = detailText;
  updates['game/phase'] = 'result';
  updates['boss/gold'] = bossGold;
  if (playerId) {
    updates['players/' + playerId + '/time'] = playerTimeSec;
    updates['players/' + playerId + '/water'] = playerWater;
  }
  update(ref(db), updates);

  if (G.betType === 'water' && outcome === 'lose') {
    setTimeout(() => showWaterAlert('喝了' + G.betAmount + '杯水！'), 500);
  }
  setTimeout(() => checkGameOver(), 1000);
}

function initSync() {
  onValue(ref(db, 'boss/mode'), snap => {
    secretMode = snap.val() || 3;
    if (hasJoined) renderUI();
  });

  onValue(ref(db, 'boss/gold'), snap => {
    bossGold = snap.val() || 60;
    if (hasJoined) {
      document.getElementById('bossGoldDisplay').textContent = bossGold;
    }
  });

  onValue(ref(db, 'game'), snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    const oldPhase = G.phase;
    G = { ...G, ...data };

    if (hasJoined) {
      if (G.phase === 'roll1' && oldPhase !== 'roll1') animateRoll1();
      else if (G.phase === 'roll2' && oldPhase !== 'roll2') animateRoll2();
      else if (G.phase === 'result' && oldPhase !== 'result') {
        if (!G.resultOutcome) calculateAndWriteResult();
        else {
          if (G.betType === 'water' && G.resultOutcome === 'lose') {
            setTimeout(() => showWaterAlert('喝了' + G.betAmount + '杯水！'), 500);
          }
          setTimeout(() => checkGameOver(), 1000);
        }
      }

      if (G.phase !== 'idle' && G.phase !== 'waiting' && !timerRunning) {
        startTimer();
      }

      renderUI();
    }
  });

  onValue(ref(db, 'players'), snap => {
    if (snap.exists() && hasJoined) {
      const players = snap.val();
      const myData = players[playerId];
      if (myData) {
        playerTimeSec = myData.time || 7200;
        playerWater = myData.water || 10;
        updateBigTimer();
        document.getElementById('playerWaterDisplay').textContent = playerWater;
      }
    }
  });
}

function initUI() {
  renderDice(document.getElementById('playerDice1'), 1);
  renderDice(document.getElementById('playerDice2'), 1);
  renderDice(document.getElementById('bossDice1'), 1);
  renderDice(document.getElementById('bossDice2'), 1);
  document.getElementById('playerDice1').classList.add('waiting');
  document.getElementById('playerDice2').classList.add('waiting');
  document.getElementById('bossDice1').classList.add('waiting');
  document.getElementById('bossDice2').classList.add('waiting');
  initSync();
  checkOrientation();
}

initUI();
</script>
